adapter:
  # Replace with an importable adapter from your LaneATT integration.
  # The object must expose predict(image_bgr) and return either:
  #   {"mask": np.ndarray, "confidence": float}
  #   {"lanes": [[(x, y), ...]], "confidence": float}
  #   or (lanes, confidence)
  target: "your_laneatt_package.adapters:LaneATTEquirectAdapter"
  kwargs: {}
