backbone:
  name: resnet18
  in_channels: 3
  pretrained: false

fpn:
  out_channels: 256

detection:
  enabled: true
  num_classes: 8
  score_threshold: 0.25
  nms_threshold: 0.5
  max_detections: 100

segmentation:
  enabled: true
  num_classes: 2
  loss: ce
  ignore_index: -100
  class_weights: [1.0, 2.0]

optimizer:
  lr: 0.0001

dataset:
  train_manifest: data/train_manifest.json
  val_manifest: data/val_manifest.json
  image_root: .
  seg_root: .
  image_size: [640, 1280]
  num_workers: 4
  normalize: true

augment:
  albumentations:
    enabled: true
    horizontal_flip_p: 0.0
    affine:
      enabled: true
      scale_limit: 0.04
      translate_percent: 0.03
      rotate_limit: 2.0
      p: 0.35
    brightness_contrast:
      enabled: true
      brightness_limit: 0.15
      contrast_limit: 0.15
      p: 0.4
    hue_saturation:
      enabled: true
      hue_shift_limit: 4
      sat_shift_limit: 8
      val_shift_limit: 8
      p: 0.2
    blur:
      enabled: true
      blur_limit: 3
      p: 0.1
  circular_shift:
    enabled: false
    max_fraction: 0.15
    shift_boxes: false

loss_weights:
  detection: 1.0
  segmentation: 1.0

label_source: lane_pseudo_labels
roi_mode: shared_roi
loss_weighting: manual
epochs: 20
batch_size: 4
log_every: 10
device: auto
