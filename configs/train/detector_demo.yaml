# ============================================================================
# Model Configuration
# ============================================================================
pretrained: true
freeze_backbone_epochs: 3
trainable_backbone_layers: 3

# ============================================================================
# Optimizer and Learning Rate
# ============================================================================
optimizer: adamw
lr: 0.0001
weight_decay: 0.0001
backbone_unfreeze_lr_scale: 0.02
max_consecutive_nonfinite_batches: 5

# ============================================================================
# Learning Rate Scheduler
# ============================================================================
scheduler: reduceonplateau
scheduler_mode: min
scheduler_metric: val/loss
scheduler_factor: 0.5
scheduler_patience: 5
scheduler_threshold: 0.0001
min_lr: 0.000001

# ============================================================================
# Early Stopping
# ============================================================================
early_stopping_metric: val/map_50
early_stopping_patience: 10
early_stopping_min_delta: 0.001

# ============================================================================
# Training Loop
# ============================================================================
epochs: 50
amp: false
gradient_clip_norm: 10.0
log_every: 10
vis_every_epochs: 1
score_thresh: 0.5

# ============================================================================
# Split Configuration
# ============================================================================
split_seed: 42
split_ratios:
  train: 0.7
  val: 0.15
  test: 0.15
use_test_split: true
group_split_key: null  # e.g., "video_id" for group-aware splitting

# ============================================================================
# K-Fold Cross-Validation (optional)
# ============================================================================
use_kfold: false
num_folds: 5
fold_index: 0

# ============================================================================
# Augmentation Configuration
# ============================================================================
augmentation:
  p_flip: 0.5
  p_affine: 0.1
  p_brightness: 0.3
  p_blur: 0.1
  p_noise: 0.05

# ============================================================================
# Low-Data Sampling Strategies (mutually exclusive)
# ============================================================================
use_weighted_sampling: false
use_repeat_factor_sampling: false
weighted_sampling:
  pow_factor: 0.5
  max_weight_cap: 10.0
repeat_factor_sampling:
  repeat_factor_threshold: 0.001

# ============================================================================
# Output Directories
# ============================================================================
device: auto
checkpoint_dir: outputs/checkpoints
tb_dir: outputs/tensorboard
pred_dir: outputs/predictions
plots_dir: outputs/plots
metrics_file: outputs/metrics.jsonl

# ============================================================================
# Weights & Biases (optional)
# ============================================================================
wandb:
  enabled: false
  project: multitask-perception
  entity: null
  run_name: null
  job_type: train-detector
  mode: online
  tags: []
  notes: null
